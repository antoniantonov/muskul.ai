name: Infrastructure CD

on:
  push:
    branches: [main, develop, 001-platform-ingestion]
    paths:
      - 'infra/pulumi/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'infra/pulumi/**'
      - '.github/workflows/infra.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PULUMI_VERSION: '3.x'

jobs:
  pulumi-preview:
    name: Pulumi Preview (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [dev, staging, prod]
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/pulumi/package-lock.json
      
      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2
        with:
          pulumi-version: ${{ env.PULUMI_VERSION }}
      
      - name: Install dependencies
        working-directory: infra/pulumi
        run: npm ci
      
      - name: Configure Azure credentials
        run: |
          echo "${{ secrets.AZURE_CREDENTIALS }}" > azure_credentials.json
          CLIENT_ID=$(jq -r '.clientId' azure_credentials.json)
          CLIENT_SECRET=$(jq -r '.clientSecret' azure_credentials.json)
          TENANT_ID=$(jq -r '.tenantId' azure_credentials.json)
          SUBSCRIPTION_ID=$(jq -r '.subscriptionId' azure_credentials.json)
          
          echo "ARM_CLIENT_ID=${CLIENT_ID}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${CLIENT_SECRET}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${TENANT_ID}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${SUBSCRIPTION_ID}" >> $GITHUB_ENV
          
          rm azure_credentials.json
      
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Select Pulumi stack
        working-directory: infra/pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi stack select ${{ matrix.stack }} --create
      
      - name: Pulumi preview
        working-directory: infra/pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi preview --diff --stack ${{ matrix.stack }}
      
      - name: Comment PR with preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Pulumi Preview: \`${{ matrix.stack }}\` 🚀
            
            <details><summary>Show Preview</summary>
            
            \`\`\`
            Pulumi preview completed for stack: ${{ matrix.stack }}
            Check the workflow logs for detailed changes.
            \`\`\`
            
            </details>
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  pulumi-up:
    name: Pulumi Deploy (${{ matrix.stack }})
    runs-on: ubuntu-latest
    needs: pulumi-preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        stack: [dev, staging, prod]
      max-parallel: 1  # Deploy one stack at a time
      fail-fast: false
    
    environment:
      name: ${{ matrix.stack }}
      url: https://muskul-${{ matrix.stack }}.azurewebsites.net
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/pulumi/package-lock.json
      
      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2
        with:
          pulumi-version: ${{ env.PULUMI_VERSION }}
      
      - name: Install dependencies
        working-directory: infra/pulumi
        run: npm ci
      
      - name: Configure Azure credentials
        run: |
          echo "${{ secrets.AZURE_CREDENTIALS }}" > azure_credentials.json
          CLIENT_ID=$(jq -r '.clientId' azure_credentials.json)
          CLIENT_SECRET=$(jq -r '.clientSecret' azure_credentials.json)
          TENANT_ID=$(jq -r '.tenantId' azure_credentials.json)
          SUBSCRIPTION_ID=$(jq -r '.subscriptionId' azure_credentials.json)
          
          echo "ARM_CLIENT_ID=${CLIENT_ID}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${CLIENT_SECRET}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${TENANT_ID}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${SUBSCRIPTION_ID}" >> $GITHUB_ENV
          
          rm azure_credentials.json
      
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Select Pulumi stack
        working-directory: infra/pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi stack select ${{ matrix.stack }}
      
      - name: Pulumi up (deploy)
        working-directory: infra/pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi up --yes --stack ${{ matrix.stack }}
      
      - name: Export stack outputs
        working-directory: infra/pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          pulumi stack output --json > stack-outputs-${{ matrix.stack }}.json
          cat stack-outputs-${{ matrix.stack }}.json
      
      - name: Upload stack outputs
        uses: actions/upload-artifact@v4
        with:
          name: pulumi-outputs-${{ matrix.stack }}
          path: infra/pulumi/stack-outputs-${{ matrix.stack }}.json
          retention-days: 30
