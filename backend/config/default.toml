# Default configuration for muskul.ai backend

[server]
host = "0.0.0.0"
port = 8080

[database]
url = "postgresql://postgres:postgres@localhost:5432/muskul"
max_connections = 10
min_connections = 2

[mongodb]
url = "mongodb://localhost:27017"
database = "muskul_activities"

[redis]
url = "redis://localhost:6379"
max_connections = 10

[auth]
jwt_secret = "change-me-in-production"
jwt_expiration_hours = 24

[providers.strava]
client_id = ""
client_secret = ""
redirect_uri = "http://localhost:8080/api/providers/strava/callback"

[providers.garmin]
client_id = ""
client_secret = ""
redirect_uri = "http://localhost:8080/api/providers/garmin/callback"

[observability]
otlp_endpoint = "http://localhost:4317"
service_name = "muskul-backend"
