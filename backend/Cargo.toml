[package]
name = "muskul-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Muskul.ai Team"]
description = "Backend API service for muskul.ai fitness platform"

[[bin]]
name = "muskul-backend"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "compression-full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "cookies", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
mongodb = "2.8"
deadpool-redis = "0.14"

# OpenTelemetry & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.20"
opentelemetry-otlp = "0.13"
opentelemetry_sdk = { version = "0.20", features = ["rt-tokio"] }
tracing-opentelemetry = "0.21"

# Validation & Error handling
validator = { version = "0.18", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Authentication
jsonwebtoken = "9.2"
argon2 = "0.5"
password-hash = "0.5"

# Async utilities
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
wiremock = "0.6"
httpmock = "0.7"
insta = "1.34"
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }

[[bench]]
name = "database_bench"
harness = false

[[bench]]
name = "api_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
