global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'muskul-platform'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      # - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Backend service (Rust)
  - job_name: 'backend'
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:3000']
        labels:
          service: 'backend'
          component: 'api'

  # AI Agent service (Python)
  - job_name: 'ai-agent'
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ['ai-agent:8000']
        labels:
          service: 'ai-agent'
          component: 'ml'

  # PostgreSQL exporter
  - job_name: 'postgres'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'

  # Node exporter (if deployed)
  # - job_name: 'node'
  #   scrape_interval: 30s
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #       labels:
  #         service: 'node-exporter'
  #         component: 'infrastructure'
